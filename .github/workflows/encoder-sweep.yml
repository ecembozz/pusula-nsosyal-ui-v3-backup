name: Multilingual Encoder Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - supervised-embedding-v1
    paths:
      - experiments/benchmark_encoder_sweep.py
      - experiments/benchmark_intent_balanced_corpus.py
      - experiments/benchmark_style_generalization.py
      - experiments/benchmark_supervised_embeddings.py
      - data/dev_labels/intent_balanced_training_v1.jsonl
      - data/gold_eval/draft_labels_annotator_a.jsonl
      - data/gold_eval/candidate_hard_cases.jsonl
      - data/gold_eval/candidate_news_cases.jsonl
      - .github/workflows/encoder-sweep.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors sentencepiece
      - name: Run encoder capacity sweep
        env:
          TOKENIZERS_PARALLELISM: 'false'
          PYTHONUNBUFFERED: '1'
        run: |
          python experiments/benchmark_encoder_sweep.py \
            --output experiments/results/encoder_sweep.json \
            --summary experiments/results/encoder_sweep.md
      - name: Commit development results
        run: |
          if [ -z "$(git status --porcelain -- experiments/results/encoder_sweep.json experiments/results/encoder_sweep.md)" ]; then
            echo "Results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/encoder_sweep.json experiments/results/encoder_sweep.md
          git commit -m "semantic-v2: record multilingual encoder sweep [skip ci]"
          git push origin HEAD:supervised-embedding-v1
