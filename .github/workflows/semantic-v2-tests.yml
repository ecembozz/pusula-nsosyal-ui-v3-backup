name: Semantic V2 Tests

on:
  push:
    branches:
      - semantic-v2
    paths:
      - "core/**"
      - "tests/**"
      - "experiments/**"
      - "scripts/**"
      - "data/**"
      - ".github/workflows/semantic-v2-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "core/**"
      - "tests/**"
      - "experiments/**"
      - "scripts/**"
      - "data/**"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile core and experiments
        run: python -m compileall -q core tests experiments scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Dataset near-duplicate audit
        run: python scripts/audit_dataset_similarity.py --output /tmp/dataset_similarity_audit.json
      - name: Draft gold baseline benchmark
        run: python experiments/benchmark_labelers.py --json-out /tmp/heuristic_draft48.json
