name: Pool 2000 to Hard 48

on:
  workflow_dispatch:
  push:
    branches:
      - supervised-embedding-v1
    paths:
      - experiments/benchmark_pool2000_to_hard48.py
      - .github/workflows/pool2000-to-hard48.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Fetch current PUSULA pool
        run: |
          mkdir -p .tmp
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/asimonmsz-design/pusula/main/kod/veri/etiketli_havuz.json \
            --output .tmp/etiketli_havuz.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('.tmp/etiketli_havuz.json').read_text(encoding='utf-8'))
          assert len(rows)==2000, len(rows)
          print({'rows':len(rows)})
          PY
      - name: Run pool-to-hard transfer benchmark
        env:
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python experiments/benchmark_pool2000_to_hard48.py \
            --pool .tmp/etiketli_havuz.json \
            --model intfloat/multilingual-e5-base \
            --output experiments/results/pool2000_to_hard48.json \
            --summary experiments/results/pool2000_to_hard48.md
      - name: Commit development results
        run: |
          if [ -z "$(git status --porcelain -- experiments/results/pool2000_to_hard48.json experiments/results/pool2000_to_hard48.md)" ]; then
            echo "Results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/pool2000_to_hard48.json experiments/results/pool2000_to_hard48.md
          git commit -m "semantic-v2: record pool-to-hard transfer benchmark [skip ci]"
          git push origin HEAD:supervised-embedding-v1
