name: Apply boot clean flex v3

on:
  push:
    branches:
      - boot-clean-flex-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boot-clean-flex-v3
          fetch-depth: 0

      - name: Patch boot and post layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(s, old, new, label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)

          css_path=Path('polish.css')
          current_css=css_path.read_text(encoding='utf-8')
          if '/* POST_INNER_FLEX_V3 */' in current_css:
              print('Patch already applied; no file mutations needed.')
          else:
              p=Path('index.html')
              s=p.read_text(encoding='utf-8')
              s=one(
                  s,
                  '<meta name="color-scheme" content="dark"/>\n<title>PUSULA X NSosyal</title>',
                  '<meta name="color-scheme" content="light dark"/>\n<script>(function(){var t="light";try{t=localStorage.getItem("pusula-theme")||"light"}catch(e){}t=t==="dark"?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t})();</script>\n<title>PUSULA X NSosyal</title>',
                  'early theme init'
              )
              s=one(
                  s,
                  '<div class="pusulaSub" id="pusulaSub">Bu oturumda ne aradığını seç; akış o amaca göre yeniden sıralansın.</div>',
                  '<div class="pusulaSub" id="pusulaSub">PUSULA kapalı · GitHub\'daki 2000 gönderi klasik sıralamada.</div>',
                  'initial pusula copy'
              )
              s=one(
                  s,
                  '</button></div></div><section class="compose" id="composeSection">',
                  '</button></div></div><div id="feedBody" class="feedBody"><section class="compose" id="composeSection">',
                  'static feedBody open'
              )
              s=one(
                  s,
                  '<div id="posts"></div></main><aside class="right">',
                  '<div id="posts"></div></div></main><aside class="right">',
                  'static feedBody close'
              )
              s=one(
                  s,
                  'render();</script><script src="/client.js"></script>',
                  '/* legacy seed render intentionally skipped; client.js owns the first feed render */</script><script src="/client.js"></script>',
                  'legacy seed render'
              )
              p.write_text(s,encoding='utf-8')

              p=Path('client.js')
              s=p.read_text(encoding='utf-8')
              s=one(
                  s,
                  'async function LF(m){G.l=true;render();try{',
                  'async function LF(m){G.l=true;if(G.f.length)render();try{',
                  'initial loading render'
              )
              a=s.index('function pc(p){')
              b=s.index('\nfunction render(){',a)
              seg=s[a:b]
              seg=one(
                  seg,
                  'return `<article class="post"><div class="avatar',
                  'return `<article class="post"><div class="postInner"><div class="avatar',
                  'postInner open'
              )
              old='</div></div></article>`}'
              pos=seg.rfind(old)
              if pos < 0:
                  raise SystemExit('postInner close: suffix not found')
              seg=seg[:pos]+'</div></div></div></article>`}'+seg[pos+len(old):]
              s=s[:a]+seg+s[b:]
              p.write_text(s,encoding='utf-8')

              p=Path('polish.js')
              s=p.read_text(encoding='utf-8')
              a=s.find('  function ensurePostFlex(){')
              b=s.find('  function settleHome(){',a)
              if a < 0 or b < 0:
                  raise SystemExit('runtime flex shim markers not found')
              s=s[:a]+s[b:]
              s=one(s,'    ensurePostFlex();\n','', 'ensurePostFlex call')
              p.write_text(s,encoding='utf-8')

              s=current_css + r'''

/* POST_INNER_FLEX_V3
   Full-width post row + a real centered flex content wrapper. */
.post{
  display:block!important;
  padding:0!important;
}
.postInner{
  width:min(840px,calc(100% - 56px))!important;
  margin:0 auto!important;
  padding:20px 0!important;
  display:flex!important;
  align-items:flex-start!important;
  gap:14px!important;
  min-width:0!important;
}
.postInner>.avatar{
  flex:0 0 41px!important;
  width:41px!important;
  height:41px!important;
}
.postInner>.postMain{
  flex:1 1 auto!important;
  min-width:0!important;
}
.postText{max-width:72ch!important}
@media(max-width:720px){
  .postInner{
    width:auto!important;
    margin:0!important;
    padding:18px 16px!important;
    gap:12px!important;
  }
  .postInner>.avatar{
    flex-basis:38px!important;
    width:38px!important;
    height:38px!important;
  }
}
'''
              css_path.write_text(s,encoding='utf-8')
              print('Patched index.html, client.js, polish.js, polish.css')
          PY

      - name: Verify invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          client=Path('client.js').read_text(encoding='utf-8')
          polish=Path('polish.js').read_text(encoding='utf-8')
          css=Path('polish.css').read_text(encoding='utf-8')
          checks={
            'early theme': 'document.documentElement.dataset.theme=t' in idx,
            'static feedBody': '<div id="feedBody" class="feedBody"><section class="compose"' in idx,
            'seed render removed': 'render();</script><script src="/client.js"></script>' not in idx,
            'real wrapper markup': '<article class="post"><div class="postInner"><div class="avatar' in client,
            'first boot no loading repaint': 'async function LF(m){G.l=true;if(G.f.length)render();try{' in client,
            'runtime shim removed': 'ensurePostFlex' not in polish,
            'wrapper css': '/* POST_INNER_FLEX_V3 */' in css and '.postInner{' in css,
          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('OK  ' if v else 'FAIL'),k)
          if bad: raise SystemExit('Verification failed: '+', '.join(bad))
          PY
          node --check client.js
          node --check polish.js

      - name: Commit patched files when changed
        shell: bash
        run: |
          if git diff --quiet -- index.html client.js polish.js polish.css; then
            echo "No app changes to commit."
            exit 0
          fi
          git config user.name "Ecem Boz"
          git config user.email "ecem.boz6@gmail.com"
          git add index.html client.js polish.js polish.css
          git commit -m "fix: atomic first paint and real post flex [boot-clean-flex-applied]"
          git push origin HEAD:boot-clean-flex-v3
