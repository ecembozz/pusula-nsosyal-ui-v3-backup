name: Fine-tune Multitask E5 Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - supervised-embedding-v1
    paths:
      - experiments/finetune_multitask_e5.py
      - data/dev_labels/intent_balanced_training_v1.jsonl
      - data/gold_eval/draft_labels_annotator_a.jsonl
      - data/gold_eval/candidate_hard_cases.jsonl
      - data/gold_eval/candidate_news_cases.jsonl
      - .github/workflows/finetune-multitask-e5.yml

permissions:
  contents: write

jobs:
  train-and-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Validate development split inputs
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          train=[json.loads(x) for x in Path('data/dev_labels/intent_balanced_training_v1.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          hard=[json.loads(x) for x in Path('data/gold_eval/draft_labels_annotator_a.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          c=Counter(r['dominant_intent'] for r in train)
          assert len(train)==136, len(train)
          assert c=={'ogretici':34,'eglendirici':34,'haber':34,'sosyal':34}, c
          assert len(hard)==48, len(hard)
          assert not ({r['id'] for r in train} & {r['id'] for r in hard})
          print({'train':len(train),'distribution':dict(c),'hard':len(hard),'overlap':0})
          PY
      - name: Train frozen control and partial encoder variant
        env:
          TOKENIZERS_PARALLELISM: 'false'
          PYTHONUNBUFFERED: '1'
        run: |
          python experiments/finetune_multitask_e5.py \
            --model intfloat/multilingual-e5-small \
            --seed 42 \
            --epochs 14 \
            --patience 4 \
            --batch-size 16 \
            --max-length 96 \
            --output experiments/results/finetune_multitask_e5.json \
            --summary experiments/results/finetune_multitask_e5.md
      - name: Commit development results
        run: |
          if [ -z "$(git status --porcelain -- experiments/results/finetune_multitask_e5.json experiments/results/finetune_multitask_e5.md)" ]; then
            echo "Results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/finetune_multitask_e5.json experiments/results/finetune_multitask_e5.md
          git commit -m "semantic-v2: record partial E5 fine-tuning pilot [skip ci]"
          git push origin HEAD:supervised-embedding-v1
