name: Semantic Model Benchmark

on:
  push:
    branches:
      - semantic-v2
    paths:
      - "experiments/benchmark_zero_shot_minilm.py"
      - ".github/workflows/semantic-model-benchmark.yml"

permissions:
  contents: read

jobs:
  minilm-zero-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" sentencepiece safetensors
      - name: Run multilingual MiniLM zero-shot benchmark
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/benchmark_zero_shot_minilm.py
