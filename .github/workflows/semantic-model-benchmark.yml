name: Semantic Model Benchmark

on:
  push:
    branches:
      - semantic-v2
    paths:
      - "experiments/benchmark_zero_shot_minilm.py"
      - "experiments/benchmark_nli_task_hypotheses.py"
      - ".github/workflows/semantic-model-benchmark.yml"

permissions:
  contents: read

jobs:
  task-aligned-nli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model:
          - "MoritzLaurer/multilingual-MiniLMv2-L6-mnli-xnli"
          - "MoritzLaurer/mDeBERTa-v3-base-mnli-xnli"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" sentencepiece safetensors
      - name: Run task-aligned NLI benchmark
        env:
          TOKENIZERS_PARALLELISM: "false"
          PUSULA_NLI_MODEL: ${{ matrix.model }}
        run: python experiments/benchmark_nli_task_hypotheses.py
