name: V4 Contrastive Intent Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - dataset-v3-realistic
    paths:
      - data/v4_calibrated/**
      - data/dev_labels/v4_contrastive_pairs_48.jsonl
      - experiments/benchmark_v4_contrastive_pairs.py
      - .github/workflows/v4-contrastive-benchmark.yml

permissions:
  contents: write

jobs:
  contrastive-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Run contrastive benchmark
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python experiments/benchmark_v4_contrastive_pairs.py \
            --model intfloat/multilingual-e5-base \
            --output experiments/results/v4_contrastive_pairs.json \
            --summary experiments/results/v4_contrastive_pairs.md
      - name: Commit contrastive results
        run: |
          FILES="experiments/results/v4_contrastive_pairs.json experiments/results/v4_contrastive_pairs.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Contrastive results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "semantic-v2: record V4 contrastive benchmark [skip ci]"
          git pull --rebase origin dataset-v3-realistic
          git push origin HEAD:dataset-v3-realistic
