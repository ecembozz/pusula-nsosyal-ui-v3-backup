name: E5 Base Adapted kNN Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - supervised-embedding-v1
    paths:
      - .github/workflows/e5-base-adapted-knn-pilot.yml

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Run light e5-base adaptation
        env:
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python experiments/fine_tune_encoder_knn.py \
            --model intfloat/multilingual-e5-base \
            --epochs 5 \
            --batch-size 8 \
            --max-length 160 \
            --unfreeze-last-n 1 \
            --encoder-lr 1e-5 \
            --head-lr 6e-4 \
            --knn-k 7 \
            --blend 0.15 \
            --output experiments/results/e5_base_adapted_knn.json \
            --summary experiments/results/e5_base_adapted_knn.md
      - name: Commit development results
        run: |
          if [ -z "$(git status --porcelain -- experiments/results/e5_base_adapted_knn.json experiments/results/e5_base_adapted_knn.md)" ]; then
            echo "Results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/e5_base_adapted_knn.json experiments/results/e5_base_adapted_knn.md
          git commit -m "semantic-v2: record e5-base adapted kNN pilot [skip ci]"
          git push origin HEAD:supervised-embedding-v1
