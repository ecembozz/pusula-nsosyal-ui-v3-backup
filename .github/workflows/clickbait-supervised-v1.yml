name: Clickbait Supervised V1 Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - dataset-v3-realistic
    paths:
      - experiments/benchmark_clickbait_supervised_v1.py
      - data/v4_calibrated/clickbait_train_*.jsonl
      - data/v4_calibrated/train_clear.jsonl
      - data/v4_calibrated/train_neutral_mixed.jsonl
      - data/v4_calibrated/hard_negative_neutral_v1.jsonl
      - data/dev_labels/v4_clickbait_stress_32.jsonl
      - core/clickbait.py
      - core/heuristic_labeler.py
      - .github/workflows/clickbait-supervised-v1.yml

permissions:
  contents: write

jobs:
  benchmark-clickbait-heads:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Benchmark dedicated clickbait classifiers
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python experiments/benchmark_clickbait_supervised_v1.py \
            --model intfloat/multilingual-e5-base \
            --output experiments/results/clickbait_supervised_v1.json \
            --summary experiments/results/clickbait_supervised_v1.md
      - name: Commit benchmark outputs
        run: |
          FILES="experiments/results/clickbait_supervised_v1.json experiments/results/clickbait_supervised_v1.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Clickbait supervised outputs already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "semantic-v3: record supervised clickbait benchmark [skip ci]"
          git pull --rebase origin dataset-v3-realistic
          git push origin HEAD:dataset-v3-realistic
