name: E5 Base Balanced Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - supervised-embedding-v1
    paths:
      - .github/workflows/e5-base-balanced-pilot.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Run stronger frozen encoder benchmark
        env:
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python experiments/benchmark_intent_balanced_corpus.py \
            --model intfloat/multilingual-e5-base \
            --output experiments/results/e5_base_intent_balanced.json \
            --summary experiments/results/e5_base_intent_balanced.md
      - name: Commit development results
        run: |
          if [ -z "$(git status --porcelain -- experiments/results/e5_base_intent_balanced.json experiments/results/e5_base_intent_balanced.md)" ]; then
            echo "Results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/e5_base_intent_balanced.json experiments/results/e5_base_intent_balanced.md
          git commit -m "semantic-v2: record e5-base balanced pilot [skip ci]"
          git push origin HEAD:supervised-embedding-v1
