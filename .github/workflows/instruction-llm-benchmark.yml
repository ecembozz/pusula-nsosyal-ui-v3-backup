name: Instruction LLM Benchmark

on:
  push:
    branches:
      - semantic-v2
    paths:
      - "experiments/benchmark_instruction_llm_qwen.py"
      - ".github/workflows/instruction-llm-benchmark.yml"

permissions:
  contents: read

jobs:
  qwen-0_5b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" sentencepiece safetensors
      - name: Run Qwen 0.5B instruction labeling benchmark
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/benchmark_instruction_llm_qwen.py
