name: Clickbait V4 Contrastive Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - dataset-v3-realistic
    paths:
      - data/v4_calibrated/**
      - data/dev_labels/v4_clickbait_pairs_24.jsonl
      - experiments/benchmark_clickbait_v4.py
      - core/heuristic_labeler.py
      - research/upstream_snapshot/kod/niyet_etiketle.py
      - .github/workflows/clickbait-v4-benchmark.yml

permissions:
  contents: write

jobs:
  clickbait-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Run clickbait contrastive benchmark
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python experiments/benchmark_clickbait_v4.py \
            --model intfloat/multilingual-e5-base \
            --output experiments/results/clickbait_v4.json \
            --summary experiments/results/clickbait_v4.md
      - name: Commit clickbait results
        run: |
          FILES="experiments/results/clickbait_v4.json experiments/results/clickbait_v4.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Clickbait results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "semantic-v3: record clickbait detector comparison [skip ci]"
          git pull --rebase origin dataset-v3-realistic
          git push origin HEAD:dataset-v3-realistic
