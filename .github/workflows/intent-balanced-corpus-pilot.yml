name: Intent Balanced Corpus Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - supervised-embedding-v1
    paths:
      - experiments/benchmark_intent_balanced_corpus.py
      - experiments/benchmark_style_generalization.py
      - experiments/benchmark_supervised_embeddings.py
      - data/dev_labels/intent_balanced_training_v1.jsonl
      - data/dev_labels/raw_training_draft_annotator_a_v1.jsonl
      - data/dev_labels/news_training_draft_annotator_a_v1.jsonl
      - data/v2_realistic/raw_posts.jsonl
      - data/gold_eval/draft_labels_annotator_a.jsonl
      - data/gold_eval/candidate_hard_cases.jsonl
      - data/gold_eval/candidate_news_cases.jsonl
      - .github/workflows/intent-balanced-corpus-pilot.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Validate balanced development corpus
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows=[json.loads(x) for x in Path('data/dev_labels/intent_balanced_training_v1.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==136, len(rows)
          c=Counter(r['dominant_intent'] for r in rows)
          assert c == {'ogretici':34,'eglendirici':34,'haber':34,'sosyal':34}, c
          assert len({r['id'] for r in rows})==136
          assert sum(1 for r in rows if r['clickbait'] >= .75) == 8
          print({'n':len(rows),'intents':dict(c),'clickbait_positive':8})
          PY
      - name: Run intent-balanced benchmark
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python experiments/benchmark_intent_balanced_corpus.py \
            --model intfloat/multilingual-e5-small \
            --output experiments/results/intent_balanced_corpus.json \
            --summary experiments/results/intent_balanced_corpus.md
      - name: Commit development results
        run: |
          if [ -z "$(git status --porcelain -- experiments/results/intent_balanced_corpus.json experiments/results/intent_balanced_corpus.md)" ]; then
            echo "Results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/intent_balanced_corpus.json experiments/results/intent_balanced_corpus.md
          git commit -m "semantic-v2: record intent-balanced corpus pilot [skip ci]"
          git push origin HEAD:supervised-embedding-v1
