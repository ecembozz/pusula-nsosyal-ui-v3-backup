name: Supervised Embedding Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - supervised-embedding-v1
    paths:
      - experiments/benchmark_supervised_embeddings.py
      - data/gold_eval/draft_labels_annotator_a.jsonl
      - data/gold_eval/candidate_hard_cases.jsonl
      - data/gold_eval/candidate_news_cases.jsonl
      - .github/workflows/supervised-embedding-pilot.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Run 4-fold supervised embedding benchmark
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python experiments/benchmark_supervised_embeddings.py \
            --model intfloat/multilingual-e5-small \
            --output experiments/results/supervised_embedding_cv.json \
            --summary experiments/results/supervised_embedding_cv.md
      - name: Commit development results
        run: |
          if [ -z "$(git status --porcelain -- experiments/results/supervised_embedding_cv.json experiments/results/supervised_embedding_cv.md)" ]; then
            echo "Results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/supervised_embedding_cv.json experiments/results/supervised_embedding_cv.md
          git commit -m "semantic-v2: record supervised embedding pilot [skip ci]"
          git push origin HEAD:supervised-embedding-v1
