name: Dataset V4 Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - dataset-v3-realistic
    paths:
      - data/v4_calibrated/**
      - data/dev_labels/v4_semantic_dev_64.jsonl
      - data/v2_realistic/raw_posts.jsonl
      - experiments/benchmark_dataset_v4_e5_base.py
      - .github/workflows/dataset-v4-benchmark.yml

permissions:
  contents: write

jobs:
  benchmark-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Benchmark V4
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python experiments/benchmark_dataset_v4_e5_base.py \
            --model intfloat/multilingual-e5-base \
            --output experiments/results/dataset_v4_e5_base.json \
            --summary experiments/results/dataset_v4_e5_base.md
      - name: Commit benchmark results
        run: |
          FILES="experiments/results/dataset_v4_e5_base.json experiments/results/dataset_v4_e5_base.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "V4 benchmark results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "semantic-v2: record calibrated V4 benchmark [skip ci]"
          git fetch origin dataset-v3-realistic
          git rebase origin/dataset-v3-realistic
          git push origin HEAD:dataset-v3-realistic
