name: Candidate Vector Head V2

on:
  workflow_dispatch:
  push:
    branches:
      - dataset-v3-realistic
    paths:
      - experiments/benchmark_vector_heads_v2.py
      - data/v3_realistic/**
      - data/v2_realistic/raw_posts.jsonl
      - .github/workflows/vector-head-v2.yml

permissions:
  contents: write

jobs:
  compare-vector-heads:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.44,<5" "scikit-learn>=1.5,<2" safetensors
      - name: Compare vector heads
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python experiments/benchmark_vector_heads_v2.py \
            --model intfloat/multilingual-e5-base \
            --output experiments/results/vector_heads_v2.json \
            --summary experiments/results/vector_heads_v2.md
      - name: Commit comparison results
        run: |
          FILES="experiments/results/vector_heads_v2.json experiments/results/vector_heads_v2.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Vector-head results already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "semantic-v2: record vector-head comparison [skip ci]"
          git fetch origin dataset-v3-realistic
          git rebase origin/dataset-v3-realistic
          git push origin HEAD:dataset-v3-realistic
